name: Feature request
description: Suggest something runner-drift should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Reads your workflows and the public runner-images manifests. It changes nothing in your repo unless you ask it to.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What got in your way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false
