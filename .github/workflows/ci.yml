name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Runner images roll roughly weekly; a scheduled run is what catches drift.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test
      - run: node src/cli.mjs --help

      # The published action, run inside its own repo — the case that used to
      # fail with exit 127. Keeping it here is what proves 1.0.2 fixed it.
      - name: Runner image drift (published action, self-hosted case)
        uses: ./

  live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: plan against the live runner-images manifests
        run: node src/cli.mjs plan --from ubuntu-22.04 --to ubuntu-24.04 --workflows test/fixtures/workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}

  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: guard (dogfood — reports drift, never fails the build)
        run: node src/cli.mjs guard --tools node,git,docker,cmake
        env:
          GITHUB_TOKEN: ${{ github.token }}

  runners:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # `permissions:` has no `administration` scope, so github.token is expected
      # to be refused here — the experience almost every user gets first. This
      # repo also has no self-hosted runners, so an empty fleet is the other
      # correct answer. Both must exit 0 and neither may crash.
      - name: runners with the default token degrades as documented, exit 0
        run: |
          set -uo pipefail
          out="$(node src/cli.mjs runners --repo "$GITHUB_REPOSITORY" --fail-on-deprecation 30 2>&1)"
          code=$?
          printf '%s\n' "$out"
          [ "$code" -eq 0 ] || { echo "expected exit 0, got $code"; exit 1; }
          if grep -q 'title=runner-drift: PERMISSION::' <<<"$out"; then
            grep -q 'repository permission (read)' <<<"$out" \
              || { echo 'PERMISSION did not name the permission'; exit 1; }
            echo 'ok: refused, and it named the permission and the endpoint'
          elif grep -q 'no self-hosted runners registered' <<<"$out"; then
            echo 'ok: readable, and the fleet is empty'
          else
            echo 'neither documented outcome was printed'; exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: --repo and --org together is a usage error (exit 2)
        run: |
          set +e
          node src/cli.mjs runners --repo a/b --org acme
          [ "$?" -eq 2 ] || { echo 'expected exit 2'; exit 1; }
