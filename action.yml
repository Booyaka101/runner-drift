name: 'runner-drift'
# NOTE: the GitHub Marketplace rejects a description of 125 characters or more.
description: 'Lock the tool versions your CI uses, diff them on every runner-image bump, and name the commit that changed them.'
author: 'Booyaka101'

branding:
  icon: 'activity'
  color: 'orange'

inputs:
  fail-on:
    description: 'Fail the job on drift of at least this severity: major, minor or any. Omit to never fail (report only).'
    required: false
    default: ''
  tools:
    description: 'Comma-separated tools to watch (e.g. python,cmake,clang). Omit to use the lock file, then workflow detection.'
    required: false
    default: ''
  lock-file:
    description: 'Path to runner-lock.json.'
    required: false
    default: 'runner-lock.json'
  workflows:
    description: 'Workflow directory scanned when there is no lock file yet.'
    required: false
    default: '.github/workflows'
  version:
    description: 'npm version of runner-drift to run.'
    required: false
    default: '1.0.2'
  github-token:
    description: 'Token used only to raise the api.github.com rate limit.'
    required: false
    default: ${{ github.token }}

outputs:
  lock-file:
    description: 'Path to the lock file that was read/written.'
    value: ${{ steps.guard.outputs.lock-file }}

runs:
  using: 'composite'
  steps:
    - id: guard
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RD_FAIL_ON: ${{ inputs.fail-on }}
        RD_TOOLS: ${{ inputs.tools }}
        RD_LOCK_FILE: ${{ inputs.lock-file }}
        RD_WORKFLOWS: ${{ inputs.workflows }}
        RD_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # Absolute paths, because npx runs from a neutral directory below.
        cd "$GITHUB_WORKSPACE"
        abs() { case "$1" in /*) printf '%s' "$1";; *) printf '%s/%s' "$PWD" "$1";; esac; }
        LOCK_ABS="$(abs "$RD_LOCK_FILE")"
        WF_ABS="$(abs "$RD_WORKFLOWS")"
        args=(guard --lock-file "$LOCK_ABS" --workflows "$WF_ABS")
        if [ -n "$RD_FAIL_ON" ]; then args+=(--fail-on "$RD_FAIL_ON"); fi
        if [ -n "$RD_TOOLS" ]; then args+=(--tools "$RD_TOOLS"); fi
        printf 'lock-file=%s\n' "$RD_LOCK_FILE" >> "$GITHUB_OUTPUT"
        # npx resolves a bin against the CWD's package.json first. In a checkout
        # whose package.json is itself named runner-drift at the same version --
        # i.e. this repo -- it decides the package is already present, looks for
        # node_modules/.bin/runner-drift, and dies with "runner-drift: not found"
        # (exit 127) before any install has run. Invoking from an empty directory
        # removes the ambiguity; --package= does NOT, it is the CWD that matters.
        RD_TMP="$(mktemp -d)"
        ( cd "$RD_TMP" && npx --yes "runner-drift@${RD_VERSION}" "${args[@]}" )
